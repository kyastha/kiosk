server {
    listen 443 ssl;
    server_name print.example.edu.np;
    ssl_certificate /etc/ssl/kiosk/fullchain.pem;
    ssl_certificate_key /etc/ssl/kiosk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Request paths contain customer or payment capabilities.
    access_log off;
    error_log /var/log/nginx/kiosk-error.log crit;
    client_max_body_size 52m;
    client_body_timeout 30s;

    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 150s;
        proxy_request_buffering off;
    }
}
